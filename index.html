.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,30,40,.15) 0%,rgba(6,30,40,.82) 100%)}
.hero div{position:relative;z-index:1;max-width:680px;margin:0 auto;width:100%;padding:24px 20px 28px;color:#fff}
.hero p{margin:0 0 6px;font-weight:600}
h1{font:800 clamp(2rem,8vw,3.2rem)/1.02 var(--hd);margin:0;letter-spacing:-.01em}
main{max-width:680px;margin:0 auto;padding:0 16px 40px}
.strip{display:flex;gap:10px;overflow-x:auto;padding:16px 4px;scroll-snap-type:x mandatory;margin:0 -4px}
.strip figure{margin:0;flex:0 0 62%;max-width:260px;scroll-snap-align:start}
.strip img{width:100%;height:190px;object-fit:cover;border-radius:14px;display:block}
.strip figcaption{font-size:.85rem;color:var(--mute);margin-top:4px}
.inc{background:var(--chip);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.inc b{font-family:var(--hd)}
form{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 18px}
fieldset{border:0;padding:0;margin:0 0 22px}
legend,label.t{font:800 1.1rem var(--hd);padding:0;margin-bottom:8px;display:block}
.hint{color:var(--mute);font-size:.9rem;margin:-4px 0 10px}
input[type=text],input[type=tel],input[type=date],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{min-height:90px;resize:vertical}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chips span{display:block;padding:10px 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--bg);font-weight:600;font-size:.95rem}
.chips input:checked+span{background:var(--deep);border-color:var(--deep);color:#fff}
.chips input:focus-visible+span{outline:3px solid var(--sea);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cnt{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--bg)}
.cnt button{width:40px;height:40px;border-radius:10px;border:0;background:var(--chip);color:var(--ink);font:800 1.3rem var(--hd);cursor:pointer}
.cnt output{font:800 1.2rem var(--hd)}
.cl{font-size:.9rem;color:var(--mute);margin-bottom:4px;display:block}
#err{color:var(--coral);font-weight:600;min-height:1.4em;margin:0 0 10px}
.send{width:100%;border:0;border-radius:14px;background:var(--wa);color:#fff;font:800 1.1rem var(--hd);padding:16px;cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:center}
.send svg{width:24px;height:24px;fill:#fff}
.fine{text-align:center;color:var(--mute);font-size:.88rem;margin-top:12px}
.fine a{color:var(--sea)}
@media(prefers-reduced-motion:no-preference){.send{transition:transform .15s}.send:active{transform:scale(.98)}}

#adm{background:var(--card);border:2px solid var(--sea);border-radius:20px;padding:18px;margin-top:20px}
#adm h2{font:800 1.3rem var(--hd);margin:0 0 4px}#adm label{display:block;font-weight:600;margin:14px 0 4px}
#adm textarea{min-height:110px}#adm .hint{margin:0 0 6px}
#adm .ph{display:flex;gap:8px;align-items:center;margin-top:8px}#adm .ph img{width:64px;height:64px;object-fit:cover;border-radius:10px}
#adm .ph input{flex:1}#adm button,#admbtn{font:800 1rem var(--hd);border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--chip);color:var(--ink)}
#adm .ok{background:var(--wa);color:#fff;width:100%;margin-top:18px;padding:16px}
#admbtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--deep);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:5}
#adst{font-weight:600;margin:10px 0 0;min-height:1.4em}
</style></head><body>
<header class="hero"><div><p id="sub"></p><h1 id="ttl"></h1></div></header>
<main>
<div class="strip" id="gal" aria-label="Fotos de paseos"></div>

<div class="chips" id="tipos"></div></fieldset>

<fieldset id="fh"><legend>Horario preferido</legend>
<div class="chips" id="horas"></div></fieldset>
<fieldset id="fx" hidden><legend>Extras</legend><div class="chips" id="extras"></div></fieldset>

<script>
(function(){

function render(){

var d=new Date(),p=function(n){return String(n).padStart(2,"0")};

$("f").addEventListener("submit",function(e){
 e.preventDefault();
 var nombre=$("nombre").value.trim(),tipos=val("#tipos input:checked"),extras=val("#extras input:checked"),fecha=$("fecha").value,err=$("err");
 if(!nombre){err.textContent="Escribe tu nombre.";$("nombre").focus();return}
 if(!tipos.length){err.textContent="Elige al menos un tour o tipo de pesca.";return}
 if(!fecha){err.textContent="Elige la fecha.";$("fecha").focus();return}
 err.textContent="";
 var f=fecha.split("-"),h=val("#horas input:checked")[0],hosp=$("hosp").value.trim(),com=$("com").value.trim();
 var m="Hola, quiero cotizar con Bacalao Sport Fishing:\n\n*Nombre:* "+nombre+"\n*Tour o pesca:* "+tipos.join(", ")+"\n*Fecha:* "+f[2]+"/"+f[1]+"/"+f[0]+
 (h?"\n*Horario:* "+h:"")+(extras.length?"\n*Extras:* "+extras.join(", "):"")+
 (hosp?"\n*Hospedaje:* "+hosp:"")+(com?"\n*Comentarios:* "+com:"");
 var u="https://wa.me/"+C.wa+"?text="+encodeURIComponent(m);
 var w=window.open(u,"_blank");if(!w){location.href=u}
});
/* ---- Administrador (solo editores del artefacto) ---- */
if(!window.claude||!claude.use)return;

 var u=r[0],art=r[1];

 function gate(){
  adm.textContent="";adm.hidden=false;
  if(!(window.crypto&&crypto.subtle)){adm.appendChild(el("p",0,"Este navegador no permite proteger con contraseña. Abre el enlace en Safari o Chrome."));return}
  var nuevo=!C.ph;adm.appendChild(el("h2",0,nuevo?"Crea tu contraseña":"Administrador"));
  adm.appendChild(el("p",{"class":"hint"},nuevo?"Mínimo 6 caracteres. Se guarda al publicar tus cambios.":"Escribe tu contraseña para editar."));
  var i=el("input",{type:"password",autocomplete:nuevo?"new-password":"current-password","aria-label":"Contraseña"}),b=el("button",{type:"button","class":"ok"},nuevo?"Crear y entrar":"Entrar"),m=el("p",{id:"adst",role:"status"});

    var s=rnd();sha(i.value,s).then(function(x){C.ps=s;C.ph=x;open0=true;build()});return}
   b.disabled=true;
   sha(i.value,C.ps).then(function(x){
    if(x===C.ph){fails=0;open0=true;build();return}
    fails++;m.textContent="Contraseña incorrecta.";setTimeout(function(){b.disabled=false},Math.min(30,fails*2)*1000)})}}
 btn.onclick=function(){if(open0){adm.hidden=!adm.hidden;if(!adm.hidden)adm.scrollIntoView()}else gate()};
 var ta={};

  var l=el("label",{"for":"a_"+key},lbl);adm.appendChild(l);
  if(hint)adm.appendChild(el("p",{"class":"hint"},hint));
  var i=multi?el("textarea",{id:"a_"+key}):el("input",{id:"a_"+key,type:"text"});
  i.value=multi?W[key].join("\n"):W[key];ta[key]=i;adm.appendChild(i)}

  box.textContent="";
  W.fotos.forEach(function(f,i){
   var r=el("div",{"class":"ph"}),im=el("img",{src:f.src,alt:""}),c=el("input",{type:"text","aria-label":"Texto de la foto"}),x=el("button",{type:"button","aria-label":"Quitar foto"},"Quitar");
   c.value=f.cap;c.oninput=function(){f.cap=c.value};x.onclick=function(){W.fotos.splice(i,1);photos(box)};

  fr.readAsDataURL(file)}
 function build(){
  adm.textContent="";ta={};W=JSON.parse(JSON.stringify(C));
  adm.appendChild(el("h2",0,"Panel de administrador"));
  adm.appendChild(el("p",{"class":"hint"},"Solo lo ves tú. Los cambios se publican para todos los clientes."));
  var pw;field("Título","titulo");field("Subtítulo","sub");field("WhatsApp (con lada del país)","wa","Ejemplo: 527551028195");
  field("Paseos y eventos","tipos","Uno por línea. Agrega, quita o renombra.",1);
  field("Horarios","horas","Uno por línea. Déjalo vacío para ocultar la pregunta.",1);
  field("Qué incluye el paseo","incluye","Uno por línea.",1);
  field("Extras opcionales","extras","Uno por línea (ej. Fotógrafo, Hielera extra). Vacío = no se muestra.",1);
  adm.appendChild(el("label",{"for":"a_pw"},"Cambiar contraseña (opcional)"));pw=el("input",{id:"a_pw",type:"password",autocomplete:"new-password",placeholder:"Déjalo vacío para conservar la actual"});adm.appendChild(pw);
  adm.appendChild(el("label",0,"Fotos"));var box=el("div");adm.appendChild(box);photos(box);
  var fi=el("input",{type:"file",accept:"image/*",hidden:""}),add=el("button",{type:"button"},"Agregar foto");
  add.style.marginTop="10px";add.onclick=function(){fi.click()};
  fi.onchange=function(){if(fi.files[0])shrink(fi.files[0],function(s){W.fotos.push({src:s,cap:"Nueva foto"});photos(box)});fi.value=""};
  adm.appendChild(add);adm.appendChild(fi);
  var ok=el("button",{type:"button","class":"ok"},"Guardar y publicar"),st=el("p",{id:"adst",role:"status"});
  adm.appendChild(ok);adm.appendChild(st);
  function save(){
   var lines=function(k){return ta[k].value.split("\n").map(function(s){return s.trim()}).filter(Boolean)};
   ["titulo","sub"].forEach(function(k){W[k]=ta[k].value.trim()});

   if(!W.tipos.length){st.textContent="Deja al menos un paseo o evento.";return}

}).catch(function(){});
})();
